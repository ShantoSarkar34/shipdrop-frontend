<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b1a"/>
      <stop offset=".55" stop-color="#13255f"/>
      <stop offset="1" stop-color="#2b4fb3"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".72" r=".6">
      <stop offset="0" stop-color="#7cb4ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7cb4ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="windows" width="22" height="26" patternUnits="userSpaceOnUse">
      <rect x="6" y="6" width="5" height="8" fill="#fcd34d" opacity=".55"/>
      <rect x="14" y="14" width="4" height="6" fill="#93c5fd" opacity=".35"/>
    </pattern>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1230"/>
      <stop offset="1" stop-color="#050813"/>
    </linearGradient>
    <linearGradient id="trailA" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trailB" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#93c5fd" stop-opacity="0"/>
      <stop offset=".5" stop-color="#bfdbfe"/>
      <stop offset="1" stop-color="#93c5fd" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-10%" y="-100%" width="120%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
    <g id="mid">
      <rect x="20" y="400" width="110" height="300"/><rect x="130" y="320" width="80" height="380"/>
      <rect x="210" y="440" width="120" height="260"/><rect x="330" y="280" width="90" height="420"/>
      <rect x="420" y="390" width="130" height="310"/><rect x="550" y="340" width="80" height="360"/>
      <rect x="630" y="420" width="100" height="280"/><rect x="730" y="260" width="120" height="440"/>
      <rect x="850" y="370" width="90" height="330"/><rect x="940" y="310" width="140" height="390"/>
      <rect x="1080" y="400" width="100" height="300"/><rect x="1180" y="270" width="90" height="430"/>
      <rect x="1270" y="380" width="130" height="320"/><rect x="1400" y="330" width="100" height="370"/>
      <rect x="1500" y="410" width="100" height="290"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <g fill="#14214f" opacity=".9">
    <rect x="0" y="500" width="80" height="200"/><rect x="80" y="440" width="60" height="260"/>
    <rect x="140" y="520" width="90" height="180"/><rect x="230" y="400" width="70" height="300"/>
    <rect x="300" y="480" width="100" height="220"/><rect x="400" y="360" width="60" height="340"/>
    <rect x="460" y="450" width="90" height="250"/><rect x="550" y="510" width="80" height="190"/>
    <rect x="630" y="390" width="110" height="310"/><rect x="740" y="470" width="70" height="230"/>
    <rect x="810" y="340" width="90" height="360"/><rect x="900" y="430" width="60" height="270"/>
    <rect x="960" y="500" width="100" height="200"/><rect x="1060" y="380" width="80" height="320"/>
    <rect x="1140" y="460" width="70" height="240"/><rect x="1210" y="410" width="110" height="290"/>
    <rect x="1320" y="490" width="60" height="210"/><rect x="1380" y="370" width="90" height="330"/>
    <rect x="1470" y="450" width="130" height="250"/>
  </g>

  <use href="#mid" fill="#0d173b"/>
  <use href="#mid" fill="url(#windows)" opacity=".65"/>

  <rect y="700" width="1600" height="200" fill="url(#road)"/>
  <path d="M -50 790 C 400 745 900 805 1700 735" stroke="url(#trailA)" stroke-width="10" fill="none" filter="url(#blur)"/>
  <path d="M -50 790 C 400 745 900 805 1700 735" stroke="url(#trailA)" stroke-width="3" fill="none"/>
  <path d="M -50 830 C 500 790 1000 850 1700 780" stroke="url(#trailB)" stroke-width="8" fill="none" filter="url(#blur)"/>
  <path d="M -50 830 C 500 790 1000 850 1700 780" stroke="url(#trailB)" stroke-width="2" fill="none"/>
  <circle cx="1180" cy="650" r="24" fill="#fbbf24" opacity=".22" filter="url(#blur)"/>
  <circle cx="420" cy="670" r="18" fill="#93c5fd" opacity=".25" filter="url(#blur)"/>

  <g fill="#050813">
    <rect x="-10" y="560" width="170" height="340"/>
    <rect x="1440" y="590" width="190" height="310"/>
  </g>
</svg>