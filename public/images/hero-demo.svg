<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1600 900"
  preserveAspectRatio="xMidYMid slice"
>
  <defs>
    <!-- Main SwiftDrop background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123d2b"/>
      <stop offset="0.5" stop-color="#174b35"/>
      <stop offset="1" stop-color="#0d3022"/>
    </linearGradient>

    <!-- Soft amber glow -->
    <radialGradient id="amberGlow" cx="78%" cy="55%" r="55%">
      <stop offset="0" stop-color="#e5aa3a" stop-opacity=".22"/>
      <stop offset=".45" stop-color="#e5aa3a" stop-opacity=".08"/>
      <stop offset="1" stop-color="#e5aa3a" stop-opacity="0"/>
    </radialGradient>

    <!-- Green glow -->
    <radialGradient id="greenGlow" cx="20%" cy="20%" r="60%">
      <stop offset="0" stop-color="#5da77c" stop-opacity=".16"/>
      <stop offset="1" stop-color="#5da77c" stop-opacity="0"/>
    </radialGradient>

    <!-- Route gradient -->
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e5aa3a" stop-opacity="0"/>
      <stop offset=".25" stop-color="#e5aa3a" stop-opacity=".7"/>
      <stop offset=".65" stop-color="#f2c66c"/>
      <stop offset="1" stop-color="#fff0bd" stop-opacity=".15"/>
    </linearGradient>

    <!-- Grid -->
    <pattern
      id="grid"
      width="80"
      height="80"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M80 0H0V80"
        fill="none"
        stroke="#ffffff"
        stroke-width="1"
        stroke-opacity=".045"
      />
    </pattern>

    <!-- Soft blur -->
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="smallBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <!-- Route glow -->
    <filter id="routeGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- ========================================================= -->
  <!-- BACKGROUND -->
  <!-- ========================================================= -->

  <rect width="1600" height="900" fill="url(#bg)"/>

  <rect width="1600" height="900" fill="url(#greenGlow)"/>
  <rect width="1600" height="900" fill="url(#amberGlow)"/>

  <!-- Very subtle map grid -->
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- Large atmospheric circles -->
  <circle
    cx="1250"
    cy="450"
    r="300"
    fill="#e5aa3a"
    opacity=".035"
  />

  <circle
    cx="1250"
    cy="450"
    r="210"
    fill="none"
    stroke="#e5aa3a"
    stroke-width="1"
    opacity=".08"
  />

  <circle
    cx="1250"
    cy="450"
    r="150"
    fill="none"
    stroke="#e5aa3a"
    stroke-width="1"
    opacity=".06"
  />

  <!-- ========================================================= -->
  <!-- ABSTRACT MAP LINES -->
  <!-- ========================================================= -->

  <g
    fill="none"
    stroke="#ffffff"
    stroke-width="2"
    stroke-linecap="round"
    opacity=".055"
  >
    <path d="M-100 230C180 160 260 290 480 235C680 185 790 110 1040 175"/>
    <path d="M-80 690C170 620 330 730 560 670C760 615 870 690 1110 610"/>
    <path d="M340 -50C300 180 410 260 350 470C300 650 390 760 350 950"/>
    <path d="M890 -50C830 160 940 280 880 460C830 610 920 760 860 950"/>
  </g>

  <!-- ========================================================= -->
  <!-- MAIN DELIVERY ROUTE -->
  <!-- ========================================================= -->

  <!-- Glow behind route -->
  <path
    d="M470 650
       C590 610 620 490 735 470
       C850 450 850 575 960 550
       C1070 525 1075 390 1195 350
       C1270 325 1330 350 1390 300"
    fill="none"
    stroke="#e5aa3a"
    stroke-width="18"
    opacity=".12"
    filter="url(#routeGlow)"
  />

  <!-- Main route -->
  <path
    d="M470 650
       C590 610 620 490 735 470
       C850 450 850 575 960 550
       C1070 525 1075 390 1195 350
       C1270 325 1330 350 1390 300"
    fill="none"
    stroke="url(#route)"
    stroke-width="4"
    stroke-linecap="round"
    stroke-dasharray="2 16"
  />

  <!-- Secondary route -->
  <path
    d="M620 760
       C710 690 740 630 820 625
       C910 620 950 700 1030 675
       C1110 650 1135 570 1220 550"
    fill="none"
    stroke="#ffffff"
    stroke-width="2"
    stroke-opacity=".12"
    stroke-dasharray="3 14"
    stroke-linecap="round"
  />

  <!-- ========================================================= -->
  <!-- ROUTE POINTS -->
  <!-- ========================================================= -->

  <!-- Pickup -->
  <circle
    cx="470"
    cy="650"
    r="10"
    fill="#e5aa3a"
    opacity=".18"
    filter="url(#smallBlur)"
  />

  <circle
    cx="470"
    cy="650"
    r="6"
    fill="#e5aa3a"
  />

  <!-- Mid point -->
  <circle
    cx="735"
    cy="470"
    r="5"
    fill="#ffffff"
    opacity=".55"
  />

  <!-- Mid point -->
  <circle
    cx="960"
    cy="550"
    r="5"
    fill="#ffffff"
    opacity=".45"
  />

  <!-- Destination -->
  <circle
    cx="1390"
    cy="300"
    r="24"
    fill="#e5aa3a"
    opacity=".08"
  />

  <circle
    cx="1390"
    cy="300"
    r="12"
    fill="#e5aa3a"
    opacity=".18"
  />

  <circle
    cx="1390"
    cy="300"
    r="6"
    fill="#f3c96e"
  />

  <!-- ========================================================= -->
  <!-- PACKAGE -->
  <!-- ========================================================= -->

  <g transform="translate(695 410)">
    <!-- shadow -->
    <ellipse
      cx="42"
      cy="88"
      rx="42"
      ry="10"
      fill="#000000"
      opacity=".16"
    />

    <!-- box -->
    <path
      d="M8 24L42 8L76 24V68L42 84L8 68V24Z"
      fill="#f4d28b"
      opacity=".95"
    />

    <!-- front -->
    <path
      d="M42 42L76 24V68L42 84V42Z"
      fill="#d99a20"
      opacity=".9"
    />

    <!-- left -->
    <path
      d="M8 24L42 42V84L8 68V24Z"
      fill="#e5aa3a"
    />

    <!-- tape -->
    <path
      d="M35 12L48 18V78L35 72V12Z"
      fill="#fff2c7"
      opacity=".72"
    />

    <!-- package line -->
    <path
      d="M8 24L42 42L76 24"
      fill="none"
      stroke="#fff4d2"
      stroke-width="2"
      opacity=".75"
    />
  </g>

  <!-- ========================================================= -->
  <!-- DELIVERY TRUCK -->
  <!-- ========================================================= -->

  <g transform="translate(1120 250)">
    <!-- glow -->
    <circle
      cx="90"
      cy="65"
      r="95"
      fill="#e5aa3a"
      opacity=".07"
      filter="url(#blur)"
    />

    <!-- truck body -->
    <path
      d="M15 30
         Q15 20 25 20
         H108
         V72
         H15
         Z"
      fill="#ffffff"
      opacity=".92"
    />

    <!-- cabin -->
    <path
      d="M108 42
         H133
         L157 60
         V72
         H108
         Z"
      fill="#f1c76c"
    />

    <!-- window -->
    <path
      d="M116 47H130L145 59H116V47Z"
      fill="#16432f"
      opacity=".9"
    />

    <!-- cargo detail -->
    <path
      d="M30 32H92"
      stroke="#174b35"
      stroke-width="3"
      opacity=".35"
    />

    <path
      d="M30 43H75"
      stroke="#174b35"
      stroke-width="3"
      opacity=".2"
    />

    <!-- wheels -->
    <circle cx="48" cy="78" r="14" fill="#0a2117"/>
    <circle cx="48" cy="78" r="6" fill="#d8d8d0"/>

    <circle cx="130" cy="78" r="14" fill="#0a2117"/>
    <circle cx="130" cy="78" r="6" fill="#d8d8d0"/>

    <!-- baseline -->
    <path
      d="M5 72H157"
      stroke="#ffffff"
      stroke-width="3"
      stroke-linecap="round"
      opacity=".35"
    />
  </g>

  <!-- ========================================================= -->
  <!-- LOCATION PIN -->
  <!-- ========================================================= -->

  <g transform="translate(1350 240)">
    <path
      d="M40 80
         C40 80 10 48 10 29
         C10 12 23 0 40 0
         C57 0 70 12 70 29
         C70 48 40 80 40 80Z"
      fill="#e5aa3a"
      opacity=".9"
    />

    <circle
      cx="40"
      cy="29"
      r="11"
      fill="#174b35"
    />
  </g>

  <!-- ========================================================= -->
  <!-- SMALL SPEED LINES -->
  <!-- ========================================================= -->

  <g
    stroke="#ffffff"
    stroke-linecap="round"
    opacity=".12"
  >
    <path d="M1010 300H1080" stroke-width="3"/>
    <path d="M980 318H1050" stroke-width="2"/>
    <path d="M1040 336H1088" stroke-width="2"/>
  </g>

  <!-- ========================================================= -->
  <!-- DARK EDGE VIGNETTE -->
  <!-- ========================================================= -->

  <rect
    width="1600"
    height="900"
    fill="none"
    stroke="#071b12"
    stroke-width="40"
    opacity=".22"
  />
</svg>